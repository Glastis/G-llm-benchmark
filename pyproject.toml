[project]
name = "benchmark-ai"
version = "0.1.0"
description = "Cost/quality benchmark of coding agents: Strata running locally against Haiku, Sonnet and Opus"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lizard>=1.24.3",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
report = ["plotly>=5.22"]

[project.scripts]
bench = "bench.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]

[tool.pytest.ini_options]
testpaths = ["bench/tests"]
